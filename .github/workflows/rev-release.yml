name: Rev GitHub Release
on:
  push:
    tags: ['v*-rev.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rev-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Isolate Git-discovery test fixtures from unrelated parent repositories
        run: mkdir -p '${{ runner.temp }}/rev-tests'
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}/rev-tests
      - run: npm run test:client
      - run: npm run typecheck
      - run: python3 -m unittest discover -s deploy/cn25/tests -p 'test_*.py'
      - run: npm run lint
      - run: npm run build
        env:
          VITE_CN25_MANAGER_MODE: '1'
      - run: npm run release:bundle
      - name: Publish only the immutable checked-out tag
        run: npm run release
        env:
          GH_TOKEN: ${{ github.token }}
