server {
    listen 8443 ssl;
    server_name cn25.foliodude.it.com;
    ssl_certificate /etc/cn25-console/tls/fullchain.pem;
    ssl_certificate_key /etc/cn25-console/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # The upstream browser transports JWTs in websocket/SSE query strings.
    # Disable request logging for this vhost so credentials never enter logs.
    access_log off;
    error_log /dev/null;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:13301;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
